<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Feedback</title>
    <link rel="stylesheet" href="styles1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
    <div class="header">
        <a href="#" class="back-button">Back</a>
        <h1>Give App Feedback</h1>
    </div>
    <div class="section-reviews">
        <h3>How do you rate our app?</h3>

        <h3>Can you tell us a little more?</h3>
        <form action="" class="profile-form">
            <label for="fname">Select feedback type</label>
            <select name="" id="">
                <option value="very-bad">Very Bad</option>
                <option value="bad">Bad</option>
                <option value="good">Good</option>
                <option value="very-Good">Very Good</option>
                <option value="Excellent">Excellent</option>
            </select>
            <textarea name="" id="">

            </textarea>
            <a href="#" class="reviews-policy-button">
                Send feedback
            </a>
        </form>

        
    </div>

    <div class="footer">
        <p>&copy; 2025 Hotels Booking. All rights reserved.</p>
        <a href="feedback.html" class="contact-button">Contact Us</a>
    </div>
</body>

</html>
