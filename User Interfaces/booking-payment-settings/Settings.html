<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        body {
            background-color: white;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            background-color: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        .container:hover {
            transform: scale(1.05);
        }
        input, select, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #004d40;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00332c;
        }
        .settings-section {
            text-align: left;
            margin-bottom: 20px;
        }
        .radio-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Settings</h2>
        
        <div class="settings-section">
            <label>Theme:</label>
            <div class="radio-container">
                <label>
                    <input type="radio" name="theme" value="light" onchange="setTheme('light')"> Light
                </label>
                <label>
                    <input type="radio" name="theme" value="dark" onchange="setTheme('dark')"> Dark
                </label>
            </div>
        </div>
        
        <div class="settings-section">
            <label for="currency">Currency:</label>
            <select id="currency">
                <option value="usd">USD</option>
                <option value="eur">EUR</option>
                <option value="sar">SAR</option>
            </select>
        </div>
        
        <div class="settings-section">
            <label>Notifications:</label><br>
            <input type="checkbox" id="notifications"> Enable Email & SMS Notifications
        </div>
        
        <div class="settings-section">
            <label>Manage Your Account:</label>
            <button onclick="toggleAccountOptions()">Manage Account</button>
            <div id="accountOptions" class="hidden">
                <button onclick="toggleChangeEmail()">Change Email</button>
                <button onclick="toggleChangePassword()">Change Password</button>
            </div>
        </div>
        
        <div id="changeEmail" class="hidden">
            <h3>Change Email</h3>
            <input type="email" id="oldEmail" placeholder="Enter Old Email">
            <input type="email" id="newEmail" placeholder="Enter New Email">
            <button onclick="updateEmail()">Update Email</button>
        </div>
        
        <div id="changePassword" class="hidden">
            <h3>Change Password</h3>
            <input type="password" id="oldPassword" placeholder="Enter Old Password">
            <input type="password" id="newPassword" placeholder="New Password">
            <input type="password" id="rePassword" placeholder="Re-enter Password">
            <button onclick="updatePassword()">Update Password</button>
        </div>
        
        <button onclick="goBack()">Back to Home</button>
    </div>
    
    <script>
        function setTheme(mode) {
            if (mode === "dark") {
                document.body.style.backgroundColor = "#1a1a1a";
                document.body.style.color = "#f5f5f5";
                localStorage.setItem("darkMode", "true");
            } else {
                document.body.style.backgroundColor = "white";
                document.body.style.color = "white";
                localStorage.setItem("darkMode", "false");
            }
        }
        
        function applyStoredTheme() {
            const isDarkMode = localStorage.getItem("darkMode") === "true";
            document.querySelector(`input[name="theme"][value="${isDarkMode ? 'dark' : 'light'}"]`).checked = true;
            setTheme(isDarkMode ? 'dark' : 'light');
        }
        
        document.addEventListener("DOMContentLoaded", applyStoredTheme);
        
        function managePrivacy() {
            alert("Privacy settings will be managed here.");
        }
        
        function toggleAccountOptions() {
            document.getElementById("accountOptions").classList.toggle("hidden");
        }
        
        function toggleChangeEmail() {
            document.getElementById("changeEmail").classList.toggle("hidden");
            document.getElementById("changePassword").classList.add("hidden");
        }
        
        function toggleChangePassword() {
            document.getElementById("changePassword").classList.toggle("hidden");
            document.getElementById("changeEmail").classList.add("hidden");
        }
        
        function updateEmail() {
            alert("Email updated successfully!");
        }
        
        function updatePassword() {
            let newPassword = document.getElementById("newPassword").value;
            let rePassword = document.getElementById("rePassword").value;
            
            if (newPassword !== rePassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }
            
            alert("Password updated successfully!");
        }
        
        function goBack() {
    window.location.href = "booking.html";
}
    </script>
</body>
</html>
