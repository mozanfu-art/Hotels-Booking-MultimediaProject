<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
         body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        select, input, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #004d40;
            color: white;
            border: none;
            cursor: pointer;
        }
        .links {
            margin-top: 15px;
        }
        .links a {
            display: inline-block;
            margin: 5px;
            color: #004d40;
            text-decoration: none;
            font-weight: bold;
        }
        #cardDetails {
            display: none;
            margin-top: 10px;
        }
    </style>
    <script>
        function formatMMYY(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 2) {
                input.value = value.slice(0, 2) + '/' + value.slice(2, 4);
            } else {
                input.value = value;
            }
        }
        function toggleCardDetails() {
            var paymentType = document.getElementById("paymentType").value;
            var cardDetails = document.getElementById("cardDetails");
            cardDetails.style.display = paymentType === "card" ? "block" : "none";
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Fill Your Information</h2>
        <div class="booker-info">
            <h3>Booker Information</h3>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" placeholder="Enter first name">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" placeholder="Enter last name">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter email">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter phone number">
        </div>
        
        <p>Total Bill: <span>$XXX</span></p>
        <select id="paymentType" onchange="toggleCardDetails()">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
        </select>
        <div id="cardDetails" style="display: none;">
            <input type="text" placeholder="Card Number">
            <input type="text" placeholder="Card Owner Name">
            <input type="text" placeholder="MM/YY" maxlength="5" oninput="formatMMYY(this)">
            <input type="text" placeholder="CCV" maxlength="3" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <button type="submit">Book Now</button>
        <div class="links">
            <a href="booking.html">Back to Booking</a>
        </div>
    </div>
</body>
<div class="btn-cont">
    <a href="Settings.html" class="button">
      <svg
        class="settings-btn"
        xmlns="http://www.w3.org/2000/svg"
        height="24"
        viewBox="0 -960 960 960"
        width="24"
        fill="#e8eaed"
      >
        <path
          d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
        ></path>
      </svg>
      <span class="tooltip">Settings</span>
    </a>
  </div>
  
  <style>
    .btn-cont {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
  
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      background-color: #004d40;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
      text-decoration: none;
    }
  
    .button:hover {
      background-color: #00332c;
    }
  
    .settings-btn {
      width: 30px;
      height: 30px;
    }
  
    .tooltip {
      display: none;
      position: absolute;
      bottom: 60px;
      right: 0;
      background: black;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
    }
    #paymentType:focus + #cardDetails {
    display: block;
}

    .button:hover .tooltip {
      display: block;
    }
  </style>
  
</html>
