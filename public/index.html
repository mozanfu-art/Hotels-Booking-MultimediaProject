<html>
<head>
    <title>WELCOME</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("./IMG/welcome-BG.jpg");
            background-origin: content-box;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 100%;
            background-position: center;
            margin: 0;
        }

        .btn {
        width: 200px;       
        height: 60px;       
        padding: 0;         
        background: #fffbf0;
        color: black;
        border-radius: 30px; 
        border: none;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        line-height: 60px;  
        box-sizing: border-box; 
        opacity: 0;
        transform: scale(1);
        animation: 
            fadeIn 1s 3s forwards,
            pulse 2s infinite 4s;
        }

        .btn:hover {
        box-shadow: 0 0 15px rgba(255, 251, 240, 0.8);
        }

        h1 {
            opacity: 0;
            animation: 
            fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>
    <audio src="./music/Background-Music.mp3" autoplay loop hidden>
        Your browser does not support the audio element.
    </audio>
    <br><br><br>
    <h1 style="margin-left: 70px; color: white; font-size: 30; animation-delay: 0.5s">WELCOME TO</h1>
    <h1 style="font-size: 450%; margin-left: 70px; color: white; animation-delay: 1s">HotelS</h1>
    <h1 style="font-size: 450%; margin-left: 70px; color: white; size: 20; animation-delay: 1.5s">BOOKING</h1>
    <h1 style="font-size: 150%; margin-left: 40px; color: white; size: 4; animation-delay: 2s">EXPLORE</h1>
    <h1 style="font-size: 150%; margin-left: 40px; color: white; size: 4; animation-delay: 2.3s">BOOK YOUR STAY NOW</h1>
    <h1 style="font-size: 150%; margin-left: 40px; color: white; size: 4; animation-delay: 2.6s">ENJOY!</h1>
    <br>
    <center>
        <h4><br><br><a href="./Start-(HB).html" class="btn">Get Started Now</a></h4>
    </center>
</body>
</html>
