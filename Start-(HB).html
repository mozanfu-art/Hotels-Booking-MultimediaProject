<html>
<head>
    <title>Get started</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #004d40;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 100%;
            margin: 0;
            position: relative; 
        }

        .Bar {
            width: 100%;
            height: 40px;
            background-color: #004d40;
        }

        .container {
            background-color: white;
            width: 35%;
            height: auto;
            margin: auto;
            text-align: center;
            padding: 5px 0px;
            border-radius: 40px;
            position: relative; 
        }

        .container:hover {
            transform: scale(1.05);
        }

        .txt {
            width: 40%;
            height: 40px;
            color: #004d40;
        }

        .input {
            border: 1px solid #004d40;
            border-radius: 1px;
            padding: 4px;
            width: 70%;
            height: 40px;
            color: #004d40;
            background-color: #fffbf0;
        }

        .input:hover {
            border: 3px solid #004d40;
        }

        .btn {
            width: 20%;
            height: 60px;
            background: #004d40;
            color: #fffbf0;
            border: none;
        }

        .btn:hover {
            background: #fffbf0;
            color: #004d40;
            border: 1px groove #004d40;
        }

        a {
            text-decoration: none;
            color: #004d40;
        }

        ::placeholder {
            color: #004d40;
            opacity: 1;
        }

        footer {
            background-color: #004d40;
            color: white;
            text-align: center;
            position: relative;
            margin-top: auto;
            width: 100%;
        }

        #main-animation-container {
            position: absolute;
            top: 70%;
            transform: translateY(-50%);
            width: 500px;
            height: 500px;
            z-index: 1;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        #header-animation {
            width: 250px !important; 
            height: 250px !important;
            margin: 0 auto ; 
            margin-bottom: -90px;  
            margin-top: -50px;  
        }

        .social-icon {
            width: 120px;
            height: 120px;
            cursor: pointer;
            transition: transform 0.3s ease;
            overflow: hidden; 
            margin-bottom: -10px;  
            margin-top: -10px;  
        }

         .social-icon svg {
            transform: scale(1.5); 
            transform-origin: center;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .form-container {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body>
    <div class="Bar">
        <a href="./WELCOME.html"><img src="./Icon/Back Arrow.png" width="35px"></a>
    </div>

    <div id="main-animation-container"></div>
    <div class="container">
    <div class="form-container">
        <div id="header-animation"></div>
        <h1>
            <font color="#004d40">Login To Your Account</font>
        </h1>
        <form action="./Login-db.php" method="POST">
            <p><input class="input" type="email" name="Email" required="true" placeholder="Email"></p>
            <p><input class="input" type="password" id="password" name="Pass" pattern="^\S{6,}$"
                    onchange="this.setCustomValidity(this.validity.patternMismatch ? 'Must have at least 6 characters' : '');"
                    placeholder="Password" required>
            <p><input type="submit" class="btn" style="width:70%; height:40px;" value="Log in" /></p>
            <a href="" style="margin-left:13%;">
                <font size="3">Forget Your Password?</font>
            </a>
            <a href="./SignUp-(HB).html" style="margin:13%;">
                <font size="3">Create Account</font>
            </a>
            <br><br>
            <h3>Continue With</h3>
            <div class="social-login">
                <div id="google-animation" class="social-icon"></div>
                <div id="facebook-animation" class="social-icon"></div>
            </div>
        </form>
    </div>
    </div>
    <footer>
        <p>&copy; 2025 Hotels Booking. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script>
        lottie.loadAnimation({
            container: document.getElementById("header-animation"),
            path: "./json/login3.json", 
            renderer: "svg",
            loop: true,
            autoplay: true,
            rendererSettings: {
            preserveAspectRatio: "xMidYMid meet" 
            }
        });

        lottie.loadAnimation({
            container: document.getElementById("main-animation-container"),
            path: "./json/Animation2.json",
            renderer: "svg",
            loop: true,
            autoplay: true,
        });

        lottie.loadAnimation({
            container: document.getElementById("google-animation"),
            path: "./json/google.json",
            renderer: "svg",
            loop: true,
            autoplay: true,
            rendererSettings: {
            preserveAspectRatio: "xMidYMid slice" 
            }
        });

        lottie.loadAnimation({
            container: document.getElementById("facebook-animation"),
            path: "./json/facebook.json",
            renderer: "svg",
            loop: true,
            autoplay: true,
            rendererSettings: {
            preserveAspectRatio: "xMidYMid slice" 
            }
        });

    </script>
</body>
</html>
